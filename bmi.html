<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI CALCULATOR</title>
    <link rel="stylesheet" href="bmi.css">
    <link  rel="stylesheet"href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 class="no">BMI CALCULATOR<i class="fa-solid fa-heart"></i></h1>
        <p class="yo">Check Your Body Mass Index Quickly And Easily.</p>
        <div class="input-box">
            <label for="weight">Weight(kg)</label>
            <input type="number" id="Weight" placeholder="Enter your Weight in Kg">
        </div>
        <div class="input-box">
            <label for="height">Height(m)</label>
            <input type="number" id="Height" step="0.01" placeholder="Example 1.65">
        </div>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <div class="result-card">
            <h2 id="result">YOUR BMI:</h2>
            <p id="category">

            </p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
